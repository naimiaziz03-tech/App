<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقسامي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أقسامي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#7a766d;--ac:#2f6f5e;--bd:#e3dfd5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#f1efe9;--mut:#9a968c;--ac:#6fc3a9;--bd:#37352f}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#f1efe9;--mut:#9a968c;--ac:#6fc3a9;--bd:#37352f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
#top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;margin-bottom:8px}
#top h1{margin:0;font-size:22px;text-align:center;display:flex;justify-content:center;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
.ic svg,.badge svg{width:24px;height:24px}
.badge{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
.add{display:flex;gap:8px;margin-bottom:16px}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;display:inline-block}
button.g,.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:transparent;color:#c0392b;padding:8px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px;cursor:pointer;font-size:18px;font-weight:600}
.hd span.ar{color:var(--mut);transition:transform .2s}
.open .hd span.ar{transform:rotate(-90deg)}
.body{display:none;padding:0 16px 16px}
.open .body{display:block}
.big{font-size:26px;font-weight:700;border:0;border-bottom:2px solid var(--ac);border-radius:0;background:transparent;padding:6px 0;margin-bottom:14px}
.vw{position:relative;background:var(--bg);border-radius:12px;margin-bottom:8px;display:flex;justify-content:center}
.vw img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:12px;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(0,0,0,.18);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nav svg{width:26px;height:26px;filter:drop-shadow(0 0 2px rgba(0,0,0,.55))}
textarea.art{border:0;background:transparent;box-shadow:none;outline:none;border-radius:0;padding:10px 2px;font-size:19px;line-height:1.95;min-height:3.5em;resize:none;overflow:hidden}
textarea.art::placeholder{color:var(--mut)}
.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.row .d{font-size:13px;padding:5px 8px}
.vw{touch-action:pan-y}
.sln{animation:sn .25s ease}.slp{animation:sp .25s ease}
@keyframes sn{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sp{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
.nav.r{right:6px}.nav.l{left:6px}
.cnt{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 10px;font-size:13px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:30px 0}
#zm{position:fixed;inset:0;background:#000;z-index:99;display:none;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
#zi{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none}
.zb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px;left:12px}
.zb button{background:rgba(255,255,255,.2);width:44px;height:44px;padding:0;font-size:22px}
</style>
</head>
<body>
<div id="top"><button class="g ic" id="bk" onclick="back()" style="visibility:hidden" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><h1 id="ttl">أقسامي</h1><button class="g ic" id="hm" onclick="home()" style="visibility:hidden" aria-label="الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button></div>
<div id="homebar"><div class="add"><input id="nt" spellcheck="true" autocorrect="on" autocomplete="on" lang="ar" placeholder="عنوان قسم جديد..."><button onclick="addSec()">إضافة</button></div>
<div class="add" style="margin-top:-6px">
  <button class="g" onclick="backup()">⬇ نسخة احتياطية</button>
  <label class="btn g" style="position:relative;overflow:hidden">⬆ استعادة<input type="file" accept=".json,application/json" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0" onchange="restore(this)"></label>
</div></div>
<div id="list"></div>
<div id="zm"><img id="zi"><div class="zb"><button onclick="zs(1.4)">+</button><button onclick="zs(1/1.4)">−</button><button onclick="zc()">✕</button></div></div>
<script>
let S=[],db=null;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("sections-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){
  let old=[];try{old=JSON.parse(localStorage.getItem("secs")||"[]")}catch(e){}
  try{
    db=await idb();
    const v=await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("secs");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});
    S=(v&&v.length)?v:old;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){S=old}
  render();if(S.length)save();
}
function save(){
  if(db){try{db.transaction("kv","readwrite").objectStore("kv").put(S,"secs");return}catch(e){}}
  try{localStorage.setItem("secs",JSON.stringify(S))}catch(e){alert("المساحة ممتلئة، احذف بعض الصور")}
}
const ICON='<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>';
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addSec(){const v=nt.value.trim();if(!v)return;S.unshift({id:Date.now(),title:v,heading:v,items:[],open:true,idx:0});nt.value="";save();render()}
let view=null,hist=[];
async function reloadData(){
  if(!db)return;
  try{const v=await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("secs");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(Array.isArray(v))S=v}catch(e){}
}
async function openSec(i){const id=S[i]&&S[i].id;await reloadData();const j=S.findIndex(s=>s.id===id);if(j<0){return home()}hist.push(view);view=j;try{history.pushState({v:j},"")}catch(e){}render();scrollTo(0,0)}
async function back(){await reloadData();view=hist.length?hist.pop():null;render();scrollTo(0,0)}
async function home(){await reloadData();hist=[];view=null;render();scrollTo(0,0)}
addEventListener("popstate",()=>{if(view!==null)back()});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState=="visible"){await reloadData();render()}});
function delSec(i){if(confirm("حذف هذا القسم؟")){S.splice(i,1);save();home()}}
function setT(i,v){S[i].heading=v;S[i].title=v||S[i].title;save();0}
function setX(i,j,v){S[i].items[j].text=v;save()}
function cur(i){const s=S[i];return Math.max(0,Math.min(s.idx||0,s.items.length-1))}
function delIt(i,j){if(!confirm("حذف هذه الصورة؟"))return;S[i].items.splice(j,1);S[i].idx=Math.max(0,j-1);save();render()}
function go(i,d){const n=S[i].items.length;S[i].idx=(cur(i)+d+n)%n;lastDir=d;render()}
function mv(i,d){const k=cur(i),a=S[i].items,t=k+d;if(t<0||t>=a.length)return;[a[k],a[t]]=[a[t],a[k]];S[i].idx=t;save();render()}
let sx=0,sy=0,lastDir=0;
function ts(e){sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY}
function te(e,i){const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3&&S[i].items.length>1)go(i,dx<0?1:-1)}
function fit(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
addEventListener("resize",()=>document.querySelectorAll("textarea.art").forEach(fit));
async function addImgs(i,inp){const fs=[...inp.files];for(const f of fs){try{S[i].items.push({img:await shrink(f),text:""})}catch(e){}}S[i].idx=S[i].items.length-1;inp.value="";save();render()}
function shrink(f){return new Promise((r,j)=>{const im=new Image();im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.8))};im.onerror=j;im.src=URL.createObjectURL(f)})}
function render(){
  const isHome=view===null;
  bk.style.visibility=hm.style.visibility=isHome?"hidden":"visible";
  homebar.style.display=isHome?"":"none";
  if(isHome){
    ttl.textContent="أقسامي";
    list.innerHTML=S.length?S.map((s,i)=>`<div class="sec"><div class="hd" onclick="openSec(${i})"><b>${esc(s.title)}</b><span class="ar">‹</span></div></div>`).join(""):'<div class="empty">لا توجد أقسام بعد. أضف عنواناً للبدء.</div>';
  }else{
    const s=S[view];if(!s){home();return}
    ttl.innerHTML=ICON;
    const i=view,n=s.items.length,k=cur(i),t=s.items[k];
    list.innerHTML=`<div class="sec"><div class="body" style="display:block;padding-top:16px">
   <input class="big" spellcheck="true" autocorrect="on" autocomplete="on" lang="ar" value="${esc(s.heading)}" placeholder="العنوان الكبير" oninput="setT(${i},this.value)">
   ${n?`<div class="vw" ontouchstart="ts(event)" ontouchend="te(event,${i})"><img class="${lastDir?(lastDir>0?'sln':'slp'):''}" src="${t.img}" onclick="zoom(${i},${k})">
     ${n>1?`<button class="nav r" onclick="go(${i},1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><button class="nav l" onclick="go(${i},-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`:""}
     <span class="cnt">${k+1} / ${n}</span></div>
   <textarea class="art" rows="1" spellcheck="true" autocorrect="on" autocomplete="on" autocapitalize="sentences" lang="ar" placeholder="اكتب ما تشاء هنا..." oninput="setX(${i},${k},this.value);fit(this)">${esc(t.text)}</textarea>
   <div class="row"><span>
     <button class="g sm" onclick="mv(${i},-1)" ${k==0?"disabled style='opacity:.4'":""}>تقديم</button>
     <button class="g sm" onclick="mv(${i},1)" ${k==n-1?"disabled style='opacity:.4'":""}>تأخير</button></span>
     <button class="d" onclick="delIt(${i},${k})">حذف الصورة</button></div>`:""}
   <div class="row"><label class="btn g" style="position:relative;overflow:hidden">+ إضافة صور<input type="file" accept="image/*" multiple style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0" onchange="addImgs(${i},this)"></label></div>
  </div></div>`;
    document.querySelectorAll("textarea.art").forEach(fit);
    lastDir=0;
  }
}
/* zoom */
let sc=1,tx=0,ty=0,t0=null,d0=0,s0=1,lt=0;
const ap=()=>{zi.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`};
function zoom(i,k){zi.src=S[i].items[k].img;sc=1;tx=ty=0;ap();zm.style.display="flex"}
function zc(){zm.style.display="none"}
function zs(f){sc=Math.min(6,Math.max(1,sc*f));if(sc==1)tx=ty=0;ap()}
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
zm.addEventListener("touchstart",e=>{
  if(e.target.tagName=="BUTTON")return;
  if(e.touches.length==2){d0=dist(e);s0=sc;t0=null}
  else{t0={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty};const n=Date.now();if(n-lt<300){sc=sc>1?1:2.5;if(sc==1)tx=ty=0;ap()}lt=n}
},{passive:true});
zm.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length==2){sc=Math.min(6,Math.max(1,s0*dist(e)/d0));if(sc==1)tx=ty=0;ap()}
  else if(t0&&sc>1){tx=e.touches[0].clientX-t0.x;ty=e.touches[0].clientY-t0.y;ap()}
},{passive:false});
zm.addEventListener("wheel",e=>{e.preventDefault();zs(e.deltaY<0?1.2:1/1.2)},{passive:false});
/* backup */
function backup(){
  const b=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="sections-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
}
async function restore(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d))throw 0;
    if(confirm("موافق = استبدال كل بيانات هذا الجهاز بالنسخة (تظهر التعديلات كما هي في النسخة)\n\nإلغاء = دمج الأقسام الجديدة فقط دون المساس بالموجود")){
      S=d;
    }else{
      const ids=new Set(S.map(s=>s.id));
      d.forEach(s=>{if(!ids.has(s.id))S.push(s)});
    }
    view=null;hist=[];save();render();alert("تمت الاستعادة");
  }catch(e){alert("ملف غير صالح")}
  inp.value="";
}
load();
if("serviceWorker" in navigator){addEventListener("load",()=>{
  let first=!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(first){first=false;return}location.reload()});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})}
</script>
</body>
</html>
