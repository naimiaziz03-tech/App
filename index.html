<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقسامي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أقسامي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#7a766d;--ac:#2f6f5e;--bd:#e3dfd5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#f1efe9;--mut:#9a968c;--ac:#6fc3a9;--bd:#37352f}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#f1efe9;--mut:#9a968c;--ac:#6fc3a9;--bd:#37352f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
#top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;margin-bottom:8px}
#top h1{margin:0;font-size:22px;text-align:center;display:flex;justify-content:center;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
.ic svg,.badge svg{width:24px;height:24px}
.badge{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
.add{display:flex;gap:8px;margin-bottom:16px}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;display:inline-block}
button.g,.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:transparent;color:#c0392b;padding:8px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px;cursor:pointer;font-size:18px;font-weight:600}
.hd span.ar{color:var(--mut);transition:transform .2s}
.open .hd span.ar{transform:rotate(-90deg)}
.body{display:none;padding:0 16px 16px}
.open .body{display:block}
.big{font-size:26px;font-weight:700;border:0;border-bottom:2px solid var(--ac);border-radius:0;background:transparent;padding:6px 0;margin-bottom:14px}
.vw{position:relative;background:var(--bg);border-radius:12px;margin-bottom:8px;display:flex;justify-content:center}
.vw img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:12px;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(0,0,0,.18);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nav svg{width:26px;height:26px;filter:drop-shadow(0 0 2px rgba(0,0,0,.55))}
textarea.art{border:0;background:transparent;box-shadow:none;outline:none;border-radius:0;padding:10px 2px;font-size:19px;line-height:1.95;min-height:3.5em;resize:none;overflow:hidden}
textarea.art::placeholder{color:var(--mut)}
select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;max-width:34%}
.add input{flex:1;min-width:0}
.mut{color:var(--mut);font-weight:400;font-size:.8em}
.srow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--bd);font-size:17px;cursor:pointer}
.srow .ar{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0}
#zm .cnt{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.txt{position:relative;margin-top:6px}
.artv{font-size:19px;line-height:1.95;white-space:pre-wrap;word-break:break-word;padding:10px 4px 10px 44px;min-height:3.5em}
.dots{position:absolute;top:4px;left:0;width:36px;height:36px;border-radius:50%;padding:0;display:grid;place-items:center;background:transparent;color:var(--mut)}
.dots svg{width:22px;height:22px}
.tmenu{display:none;position:absolute;top:42px;left:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:6;min-width:150px;overflow:hidden}
.tmenu button{display:block;width:100%;text-align:right;background:transparent;color:var(--tx);border-radius:0;padding:12px 16px;border-bottom:1px solid var(--bd)}
.tmenu button:last-child{border-bottom:0}
textarea.art.ed{border:1px solid var(--ac);border-radius:12px;padding:12px}
.row .d{font-size:13px;padding:5px 8px}
.vw{touch-action:pan-y}
body{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.home #list{margin-top:auto}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;user-drag:none}
#top h1{min-width:0;font-size:20px;font-weight:700}
.ttx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pgb{display:flex;flex-direction:column;flex:1}
body:not(.home) #list{flex:1;display:flex;flex-direction:column}
body:not(.home) #list>.sec{flex:1;display:flex;flex-direction:column}
.chips.bot{margin-top:auto;padding-top:14px;border-top:1px solid var(--bd)}
#mb,#hm{grid-column:3;grid-row:1}
#hmenu{display:none;position:absolute;left:0;top:56px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;min-width:190px;overflow:hidden}
#hmenu.show{display:block}
#hmenu button,#hmenu .mi{display:block;width:100%;text-align:right;background:transparent;color:var(--tx);border:0;border-radius:0;padding:14px 16px;font:inherit;position:relative;cursor:pointer}
#hmenu>*+*{border-top:1px solid var(--bd)}
#hmenu .mi input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0}
.fc{width:100%;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fi{width:72px;height:88px;border-radius:12px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.fn{font-weight:600;overflow-wrap:anywhere}.fs{color:var(--mut);font-size:13px}
.fb{display:flex;gap:8px}
.sln{animation:sn .25s ease}.slp{animation:sp .25s ease}
@keyframes sn{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sp{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
.nav.r{right:6px}.nav.l{left:6px}
.cnt{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 10px;font-size:13px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:30px 0}
#zm{position:fixed;inset:0;background:#000;z-index:99;display:none;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
#zi{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none}
.zb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px;left:12px}
.zb button{background:rgba(255,255,255,.2);width:44px;height:44px;padding:0;font-size:22px}
</style>
</head>
<body>
<div id="top"><button class="g ic" id="bk" onclick="back()" style="visibility:hidden" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><h1 id="ttl">أقسامي</h1><button class="g ic" id="hm" onclick="home()" style="visibility:hidden" aria-label="الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button><button class="g ic" id="mb" onclick="toggleMain(event)" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div id="hmenu" onclick="event.stopPropagation()"><button onclick="exportAll();closeMain()">📦 ملف كامل</button><button onclick="backup();closeMain()">⬇ نسخة احتياطية</button><label class="mi">⬆ استعادة<input type="file" accept=".html,.htm,.json,text/html,application/json" onchange="restore(this)"></label></div></div>
<div id="homebar"><div class="add"><input id="nt" spellcheck="true" autocorrect="on" autocomplete="on" lang="ar" placeholder="عنوان قسم جديد..."><select id="ng"><option value="g1">الاختبارات</option><option value="g2">معدات</option><option value="g3">مخططات</option></select><button onclick="addSec()">إضافة</button></div>
</div>
<div id="list"></div>
<div id="zm"><img id="zi"><span class="cnt" id="zcnt"></span><div id="zNav"><button class="nav r" onclick="zgo(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><button class="nav l" onclick="zgo(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button></div></div>
<script id="emb" type="application/json"></script>
<script>
const SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
let S=[],db=null;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("sections-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){
  let old=[];try{old=JSON.parse(localStorage.getItem("secs")||"[]")}catch(e){}
  try{
    db=await idb();
    const v=await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("secs");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});
    S=(v&&v.length)?v:old;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){S=old}
  await applyEmbedded();render();if(S.length)save();
}
function embedded(){try{const t=document.getElementById("emb").textContent.trim();if(!t)return null;const o=JSON.parse(t);return Array.isArray(o.data)?o:null}catch(e){return null}}
async function applyEmbedded(){
  const o=embedded();if(!o||!o.data.length)return;
  let seen="";try{seen=localStorage.getItem("emb_at")||""}catch(e){}
  if(String(o.at)===seen)return;
  if(!db){
    if(!S.length)S=o.data;
    list.insertAdjacentHTML("beforebegin",'<div class="mut" style="padding:8px 2px">وضع الملف: تعرض كل المحتوى لكن التعديلات لا تُحفظ هنا. لحفظها استورد هذا الملف داخل التطبيق المثبّت بزر «استعادة».</div>');
    return;
  }
  if(!S.length){S=o.data}
  else if(confirm("هذا الملف يحتوي على "+o.data.length+" قسماً محفوظة داخله.\n\nموافق = استبدال بيانات هذا الجهاز بها\nإلغاء = دمج الأقسام الجديدة فقط")){S=o.data}
  else{const ids=new Set(S.map(s=>s.id));o.data.forEach(s=>{if(!ids.has(s.id))S.push(s)})}
  try{localStorage.setItem("emb_at",String(o.at))}catch(e){}
  save();
}
function parseBackup(t){
  t=t.trim();
  if(t[0]==="["||t[0]==="{"){const o=JSON.parse(t);return Array.isArray(o)?o:o.data}
  const m=t.match(/<script id="emb" type="application\/json">([\s\S]*?)<\/script>/);
  if(!m)throw 0;
  const o=JSON.parse(m[1]);if(!Array.isArray(o.data))throw 0;return o.data;
}
function exportAll(){
  const j=JSON.stringify({v:1,at:Date.now(),data:S}).replace(/</g,"\\u003c");
  const html=SRC.replace(/(<script id="emb" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download="sections-full-"+new Date().toISOString().slice(0,10)+".html";
  document.body.appendChild(a);a.click();a.remove();
}
function save(){
  if(db){try{db.transaction("kv","readwrite").objectStore("kv").put(S,"secs");return}catch(e){}}
  try{localStorage.setItem("secs",JSON.stringify(S))}catch(e){if(!window._w){window._w=1;alert("تعذّر الحفظ على هذا الجهاز. إن كنت تفتح ملفاً مباشرة فاستورده داخل التطبيق المثبّت من زر «استعادة».")}}
}
const ICON='<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>';
const GR=[{id:"g1",n:"الاختبارات"},{id:"g2",n:"معدات"},{id:"g3",n:"مخططات"}];
let GO={};try{GO=JSON.parse(localStorage.getItem("go")||"{}")}catch(e){}
function togG(id){GO[id]=!GO[id];try{localStorage.setItem("go",JSON.stringify(GO))}catch(e){}render()}
function setG(i,g){S[i].group=g;GO[g]=true;try{localStorage.setItem("go",JSON.stringify(GO))}catch(e){}save();render()}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addSec(){const v=nt.value.trim();if(!v)return;S.unshift({id:Date.now(),title:v,heading:v,items:[],open:true,idx:0,group:ng.value});GO[ng.value]=true;try{localStorage.setItem("go",JSON.stringify(GO))}catch(e){}nt.value="";save();render()}
let view=null,hist=[];
async function reloadData(){
  if(!db)return;
  try{const v=await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("secs");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(Array.isArray(v))S=v}catch(e){}
}
async function openSec(i){const id=S[i]&&S[i].id;await reloadData();const j=S.findIndex(s=>s.id===id);if(j<0){return home()}hist.push(view);view=j;try{history.pushState({v:j},"")}catch(e){}render();scrollTo(0,0)}
async function back(){await reloadData();view=hist.length?hist.pop():null;render();scrollTo(0,0)}
async function home(){await reloadData();hist=[];view=null;render();scrollTo(0,0)}
addEventListener("popstate",()=>{if(zm.style.display=="flex"){zclose();return}if(view!==null)back()});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState=="visible"){await reloadData();render()}});
function delSec(i){if(confirm("حذف هذا القسم؟")){S.splice(i,1);save();home()}}
function setT(i,v){S[i].heading=v;S[i].title=v||S[i].title;save();0}
function setX(i,j,v){S[i].items[j].text=v;save()}
function cur(i){const s=S[i];return Math.max(0,Math.min(s.idx||0,s.items.length-1))}
function delIt(i,j){if(!confirm("حذف هذا العنصر؟"))return;S[i].items.splice(j,1);S[i].idx=Math.max(0,j-1);save();render()}
function go(i,d){const n=S[i].items.length;S[i].idx=(cur(i)+d+n)%n;lastDir=d;render()}
function mv(i,d){const k=cur(i),a=S[i].items,t=k+d;if(t<0||t>=a.length)return;[a[k],a[t]]=[a[t],a[k]];S[i].idx=t;save();render()}
let sx=0,sy=0,lastDir=0,edit=null;
function txtBlock(i,k,t){
  if(edit&&edit.i===i&&edit.k===k){
    return `<div class="txt"><textarea class="art ed" rows="3" spellcheck="true" autocorrect="on" autocomplete="on" autocapitalize="sentences" lang="ar" placeholder="اكتب ما تشاء هنا..." oninput="setX(${i},${k},this.value);fit(this)">${esc(t.text)}</textarea><div class="row"><span></span><button class="sm" onclick="endEdit()">تم</button></div></div>`;
  }
  return `<div class="txt"><button class="dots" onclick="tmenu(event)" aria-label="خيارات النص"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button><div class="tmenu" id="tm"><button onclick="startEdit(${i},${k})">تعديل النص</button><button onclick="pasteTxt(${i},${k})">لصق</button></div><div class="artv">${t.text?esc(t.text):'<span class="mut">لا يوجد نص. اضغط على النقاط الثلاث للإضافة.</span>'}</div></div>`;
}
function tmenu(e){e.stopPropagation();const m=document.getElementById("tm");if(m)m.style.display=m.style.display=="block"?"none":"block"}
document.addEventListener("click",()=>{const m=document.getElementById("tm");if(m)m.style.display="none"});
function startEdit(i,k){edit={i,k};render();const t=document.querySelector("textarea.art");if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
function endEdit(){edit=null;render()}
async function pasteTxt(i,k){
  try{
    const c=await navigator.clipboard.readText();
    if(!c){alert("الحافظة فارغة");return}
    const it=S[i].items[k];it.text=(it.text?it.text.replace(/\s+$/,"")+"\n\n":"")+c;save();render();
  }catch(e){startEdit(i,k);alert("اضغط مطولاً داخل المربع ثم اختر «لصق»")}
}
function ts(e){sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY}
function te(e,i){const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3&&S[i].items.length>1)go(i,dx<0?1:-1)}
function fit(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
addEventListener("resize",()=>document.querySelectorAll("textarea.art").forEach(fit));
function readData(f){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f)})}
async function addImgs(i,inp){
  const fs=[...inp.files];
  for(const f of fs){
    if(f.size>40*1048576){alert("الملف «"+f.name+"» أكبر من 40 ميغابايت وتم تجاوزه");continue}
    try{
      if(f.type.startsWith("image/")){
        try{const d=f.type==="image/gif"?await readData(f):await shrink(f);S[i].items.push({img:d,text:""});continue}catch(e){}
      }
      S[i].items.push({file:{name:f.name,type:f.type||"application/octet-stream",size:f.size,data:await readData(f)},text:""});
    }catch(e){}
  }
  S[i].idx=S[i].items.length-1;inp.value="";save();render();
}
function fmtSize(b){return b<1048576?Math.max(1,Math.round(b/1024))+" ك.ب":(b/1048576).toFixed(1)+" م.ب"}
function fileCard(i,k,t){
  const f=t.file||{name:"ملف",size:0},p=f.name.split("."),ext=(p.length>1?p.pop():"FILE").slice(0,4).toUpperCase();
  return `<div class="fc ${lastDir?(lastDir>0?"sln":"slp"):""}"><div class="fi">${esc(ext)}</div><div class="fn">${esc(f.name)}</div><div class="fs">${fmtSize(f.size||0)}</div><div class="fb"><button onclick="fileOpen(${i},${k})">فتح</button><button class="g" onclick="fileSave(${i},${k})">حفظ</button></div></div>`;
}
function dataBlob(d,t){const p=d.split(","),bin=atob(p[1]),u=new Uint8Array(bin.length);for(let x=0;x<bin.length;x++)u[x]=bin.charCodeAt(x);return new Blob([u],{type:t})}
function fileOpen(i,k){const f=S[i].items[k].file,u=URL.createObjectURL(dataBlob(f.data,f.type));const w=window.open(u,"_blank");if(!w)fileSave(i,k)}
function fileSave(i,k){const f=S[i].items[k].file,a=document.createElement("a");a.href=URL.createObjectURL(dataBlob(f.data,f.type));a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
function shrink(f){return new Promise((r,j)=>{const im=new Image();im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.8))};im.onerror=j;im.src=URL.createObjectURL(f)})}
function render(){
  const isHome=view===null;document.body.classList.toggle("home",isHome);
  bk.style.visibility=isHome?"hidden":"visible";hm.style.visibility="visible";hm.style.display=isHome?"none":"grid";mb.style.display=isHome?"grid":"none";closeMain();
  homebar.style.display=isHome?"":"none";
  if(isHome){
    ttl.textContent="أقسامي";ttl.onclick=null;ttl.removeAttribute("aria-label");edit=null;
    list.innerHTML=GR.map(g=>{
      const its=S.map((s,i)=>({s,i})).filter(x=>(x.s.group||"g1")==g.id),op=!!GO[g.id];
      return `<div class="sec ${op?"open":""}"><div class="hd" onclick="togG('${g.id}')"><b>${g.n} <span class="mut">(${its.length})</span></b><span class="ar">‹</span></div>${op?(its.length?its.map(x=>`<div class="srow" onclick="openSec(${x.i})"><span>${esc(x.s.title)}</span><span class="ar">‹</span></div>`).join(""):'<div class="empty" style="padding:14px">لا توجد أقسام</div>'):""}</div>`}).join("");
  }else{
    const s=S[view];if(!s){home();return}
    ttl.innerHTML='<span class="ttx">'+esc(s.title)+'</span>';ttl.onclick=null;ttl.removeAttribute("aria-label");
    const i=view,n=s.items.length,k=cur(i),t=s.items[k];
    if(edit&&(edit.i!==i||edit.k!==k))edit=null;
    list.innerHTML=`<div class="sec"><div class="body pgb" style="padding-top:16px">
   ${n?`<div class="vw" ontouchstart="ts(event)" ontouchend="te(event,${i})">${t.img?`<img class="${lastDir?(lastDir>0?'sln':'slp'):''}" src="${t.img}" onclick="zoom(${i},${k})">`:fileCard(i,k,t)}
     ${n>1?`<button class="nav r" onclick="go(${i},1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><button class="nav l" onclick="go(${i},-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`:""}
     <span class="cnt">${k+1} / ${n}</span></div>
   ${txtBlock(i,k,t)}
   <div class="row"><span>
     <button class="g sm" onclick="mv(${i},-1)" ${k==0?"disabled style='opacity:.4'":""}>تقديم</button>
     <button class="g sm" onclick="mv(${i},1)" ${k==n-1?"disabled style='opacity:.4'":""}>تأخير</button></span>
     <button class="d" onclick="delIt(${i},${k})">حذف</button></div>`:""}
   <div class="row"><label class="btn g" style="position:relative;overflow:hidden">+ إضافة صور أو ملفات<input type="file" multiple style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0" onchange="addImgs(${i},this)"></label></div>
   <div class="chips bot"><span class="mut">نقل القسم إلى:</span>${GR.map(g=>`<button class="${(s.group||"g1")==g.id?"":"g"} sm" onclick="setG(${i},'${g.id}')">${g.n}</button>`).join("")}</div>
  </div></div>`;
    document.querySelectorAll("textarea.art").forEach(fit);
    lastDir=0;
  }
}
/* zoom */
let sc=1,tx=0,ty=0,t0=null,d0=0,s0=1,lt=0,zI=0,zK=0,zsx=0,zsy=0,zmulti=false;
const ap=()=>{zi.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`};
function zshow(){const n=S[zI].items.length;zi.src=S[zI].items[zK].img;sc=1;tx=ty=0;ap();zcnt.textContent=(zK+1)+" / "+n;zNav.style.display=n>1?"":"none"}
function zoom(i,k){zI=i;zK=k;zshow();zm.style.display="flex";try{history.pushState({z:1},"")}catch(e){}}
function zgo(d){const a=S[zI].items,n=a.length;let x=zK;for(let c=0;c<n;c++){x=(x+d+n)%n;if(a[x].img)break}if(!a[x].img||x===zK)return;zK=x;S[zI].idx=zK;save();zshow()}
function zclose(){if(zm.style.display=="none")return;zm.style.display="none";render()}
function zs(f){sc=Math.min(6,Math.max(1,sc*f));if(sc==1)tx=ty=0;ap()}
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
zm.addEventListener("touchstart",e=>{
  if(e.target.closest&&e.target.closest("button"))return;
  if(e.touches.length==2){d0=dist(e);s0=sc;t0=null;zmulti=true}
  else if(e.touches.length==1){
    zmulti=false;zsx=e.touches[0].clientX;zsy=e.touches[0].clientY;t0={x:zsx-tx,y:zsy-ty};
    const n=Date.now();if(n-lt<300){sc=sc>1?1:2.5;if(sc==1)tx=ty=0;ap()}lt=n;
  }
},{passive:true});
zm.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length==2){sc=Math.min(6,Math.max(1,s0*dist(e)/d0));if(sc==1)tx=ty=0;ap()}
  else if(t0&&sc>1){tx=e.touches[0].clientX-t0.x;ty=e.touches[0].clientY-t0.y;ap()}
},{passive:false});
zm.addEventListener("touchend",e=>{
  if(e.target.closest&&e.target.closest("button"))return;
  if(e.touches.length==0&&!zmulti&&sc==1){
    const c=e.changedTouches[0],dx=c.clientX-zsx,dy=c.clientY-zsy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){lt=0;zgo(dx<0?1:-1)}
  }
  if(sc<1.03){sc=1;tx=ty=0;ap()}
},{passive:true});
zm.addEventListener("wheel",e=>{e.preventDefault();zs(e.deltaY<0?1.2:1/1.2)},{passive:false});
/* backup */
function renameSec(){const s=S[view];if(!s)return;const v=prompt("اسم القسم:",s.title);if(v&&v.trim()){s.title=s.heading=v.trim();save()}}
function toggleMain(e){e.stopPropagation();hmenu.classList.toggle("show")}
function closeMain(){hmenu.classList.remove("show")}
document.addEventListener("click",closeMain);
document.addEventListener("contextmenu",e=>{if(!e.target.closest("textarea,input"))e.preventDefault()});
function backup(){
  const b=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="sections-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
}
async function restore(inp){closeMain();
  const f=inp.files[0];if(!f)return;
  try{
    const d=parseBackup(await f.text());
    if(!Array.isArray(d))throw 0;
    if(confirm("موافق = استبدال كل بيانات هذا الجهاز بالنسخة (تظهر التعديلات كما هي في النسخة)\n\nإلغاء = دمج الأقسام الجديدة فقط دون المساس بالموجود")){
      S=d;
    }else{
      const ids=new Set(S.map(s=>s.id));
      d.forEach(s=>{if(!ids.has(s.id))S.push(s)});
    }
    view=null;hist=[];save();render();alert("تمت الاستعادة");
  }catch(e){alert("ملف غير صالح")}
  inp.value="";
}
load();
if("serviceWorker" in navigator){addEventListener("load",()=>{
  let first=!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(first){first=false;return}location.reload()});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})}
</script>
